name: ar_location_viewer
description: ArLocationViewer is designed for areas with a large concentration of static POIs.
# pub.dev using `flutter pub publish`.
version: 4.0.0
homepage: 'https://github.com/dariocavada/ar_location_viewer.git'

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  sensors_plus: ^7.1.0
  camera: ^0.12.0+2
  permission_handler: ^13.0.1
  vector_math: ^2.4.2
  geolocator: ^14.0.3
  native_device_orientation: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  plugin:
    platforms:
      android:
        package: eu.suggesto.ar_location_viewer
        pluginClass: ArLocationViewerPlugin
      ios:
        pluginClass: ArLocationViewerPlugin
