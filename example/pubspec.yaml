publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  ar_location_viewer:
    path: ../

  cupertino_icons: ^1.0.9
  geolocator: ^14.0.3
  uuid: ^4.6.0
  material_color_utilities: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
